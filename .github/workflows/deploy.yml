name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: 'npm'
          cache-dependency-path: effortsengineers-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd effortsengineers-frontend
          npm install

      - name: Build Next.js (static export)
        run: |
          cd effortsengineers-frontend
          npm run build
          touch out/.nojekyll
        env:
          GITHUB_PAGES: 'true'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./effortsengineers-frontend/out
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "deploy: automated static export from ${{ github.sha }}"

