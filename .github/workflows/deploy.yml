name: Auto PR, merge and deploy

on:
  push:
    branches: ['**']   # all branches, including main

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-and-merge:
    # Only for feature branches
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            TITLE=$(echo "$COMMIT_MSG" | head -n1)
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "Auto-created from push to $BRANCH"
          fi

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash

      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${GITHUB_REF_NAME}"
          

  deploy:
    # Runs after a successful merge, or on any direct push to main
    needs: pr-and-merge
    if: always() && (needs.pr-and-merge.result == 'success' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

