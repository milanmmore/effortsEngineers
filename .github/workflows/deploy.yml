name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - dev
      - main
      - feature/frontend-v1.0.2
    paths:
      - 'README.md'
      - 'PROJECT_PLAN.md'
      - 'docs/**'
      - 'index.html'
      - '_sidebar.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Documentation for GitHub Pages
        run: |
          mkdir -p _site
          # Copy homepage (README.md) and main docs
          cp README.md _site/README.md
          cp PROJECT_PLAN.md _site/PROJECT_PLAN.md
          cp index.html _site/index.html
          cp _sidebar.md _site/_sidebar.md
          cp .nojekyll _site/.nojekyll
          
          # Copy Master Excel test suite if present
          if [ -f Efforts_Engineers_Master_Test_Suite.xlsx ]; then
            cp Efforts_Engineers_Master_Test_Suite.xlsx _site/Efforts_Engineers_Master_Test_Suite.xlsx
          fi
          
          # Copy docs folder recursively
          if [ -d docs ]; then
            cp -r docs _site/docs
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "docs: deploy documentation site from ${{ github.sha }}"
