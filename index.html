<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Efforts Engineers — Industrial Platform Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Efforts Engineers Compressor Spares & Overhaul Platform Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --theme-color: #0284c7;
      --sidebar-width: 290px;
    }
    .sidebar {
      background-color: #0f172a !important;
      border-right: 1px solid #1e293b;
    }
    .sidebar-nav a {
      color: #cbd5e1 !important;
      font-size: 14px;
      line-height: 1.6;
    }
    .sidebar-nav strong {
      color: #94a3b8 !important;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-top: 14px;
      display: inline-block;
    }
    .sidebar-nav li.active > a {
      color: #38bdf8 !important;
      font-weight: 700 !important;
      border-right: 3px solid #0284c7;
    }
    .app-name-link {
      color: #ffffff !important;
      font-weight: 800 !important;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: #0f172a;
    }
    .markdown-section a {
      color: #0284c7;
      font-weight: 600;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      margin: 1.5em 0;
      border-collapse: collapse;
    }
    .markdown-section th {
      background: #0f172a;
      color: #ffffff;
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-section td {
      padding: 9px 14px;
      border: 1px solid #e2e8f0;
    }
    .markdown-section tr:nth-child(2n) {
      background-color: #f8fafc;
    }
  </style>
</head>
<body>
  <div id="app">Loading Efforts Engineers Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Efforts Engineers',
      repo: 'https://github.com/milanmmore/EffortsEngineers',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
